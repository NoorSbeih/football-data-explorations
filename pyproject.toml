[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "football-data-explorations"
version = "0.1.0"
description = "Reusable StatsBomb football event-data loaders, analysis, and pitch maps."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "matplotlib",
    "statsbombpy",
    "mplsoccer",
    "pyarrow",
]

[project.optional-dependencies]
notebooks = ["notebook", "ipykernel"]
api = ["fastapi", "uvicorn[standard]"]
dev = ["pytest", "pytest-cov", "httpx", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
